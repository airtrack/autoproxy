listen = { http = "127.0.0.1:8080", socks5 = "127.0.0.1:1080" }
# the default proxy group; rules without `group` use this one
proxy = { http = "127.0.0.1:18080", socks5 = "127.0.0.1:11080" }
dns = { listen = "127.0.0.1:55353", upstream_direct = "system", upstream_proxy = "8.8.8.8:53" }

# optional: hosts files, same format as /etc/hosts
# hosts_ipv4 = "config/hosts4.txt"
# hosts_ipv6 = "config/hosts6.txt"

# optional: OTLP/HTTP metrics. Without an endpoint (or with endpoint = "") the
# proxy runs on the no-op recorder and starts no exporter thread.
#
# Every point carries service.instance.id = the device's outbound IP, found
# with a UDP route lookup to 8.8.8.8 (no packet is sent). Override it when that
# route does not identify the device, for example behind a tunnel:
otel = { endpoint = "http://10.0.0.36:4318", service_name = "autoproxy", export_interval_secs = 15 }
# otel = { endpoint = "http://127.0.0.1:4318", protocol = "http-json",
#          service_name = "autoproxy", export_interval_secs = 15,
#          instance_id = "10.0.0.37", headers = { authorization = "Bearer ..." } }

# suffix_domains.txt:
# ```
# cn
# example.com
# ```
#
# domain_sets = [
#     { name = "default", file = "suffix_domains.txt" }
# ]

# mmdb_sets = [
#     { name = "default", file = "Country.mmdb" }
# ]

# optional: the global mmdb file
# mmdb = "Country.mmdb"

rules = [
    { type = "IpNet", ipnet = "127.0.0.0/8", rule = "Direct" },
    { type = "IpNet", ipnet = "10.0.0.0/8", rule = "Direct" },
    { type = "DomainKeyword", keyword = "apple", rule = "Direct" },
    { type = "DomainKeyword", keyword = "icloud", rule = "Direct" },

    # use the suffix domain file associated with the name `default` in domain_sets
    # { type = "DomainSuffixSet", name = "default", rule = "Proxy" },
    # use the suffix_domains.txt file directly
    # { type = "DomainSuffixSet", file = "suffix_domains.txt", rule = "Proxy" },

    # route matching domains through a named proxy group
    # { type = "DomainKeyword", keyword = "google", rule = "Proxy", group = "us" },

    # use the global mmdb file
    # { type = "GeoIp", country = "CN", rule = "Direct" },
    # use the mmdb file associated with the name `default` in mmdb_sets
    # { type = "GeoIp", name = "default", country = "CN", rule = "Direct" },

    { type = "Direct", rule = "Proxy" }
]

# Optional named proxy groups. `proxy` above is the default group; rules select
# one of these with `group = "us"`. DNS and SOCKS5 UDP still use the default
# group's socks5 address for now.
#
# Keep this table block after every top-level key: in TOML, keys following a
# table header belong to that table.
#
# [proxy_groups.us]
# http = "127.0.0.1:28080"
# socks5 = "127.0.0.1:21080"
