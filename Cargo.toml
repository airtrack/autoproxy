[package]
name = "autoproxy"
version = "0.2.1"
authors = ["airtrack <airtrack.sk@gmail.com>"]
edition = "2024"

[dependencies]
socks5 = { git = "https://github.com/airtrack/sproxy.git", tag = "0.1.1" }
httpproxy = { git = "https://github.com/airtrack/sproxy.git", tag = "0.1.1" }
tokio = { version = "1.38.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
maxminddb = "0.17"
async-trait = "*"
httparse = "*"
ipnet = "2.9.0"
toml = "0.8.8"
serde = "1.0"
futures = "0.3"
aho-corasick = "1.1.2"
log = "0.4"
env_logger = "0.11"
hickory-proto = "0.24"
hickory-resolver = "0.24"
anyhow = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
oslog = "*"
